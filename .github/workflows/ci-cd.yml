name: Fullstack CI/CD


on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop



permissions:

  contents: read

  packages: write



env:

  REGISTRY: ghcr.io



jobs:


# ==================================================
# BUILD AND PUSH IMAGES
# ==================================================

  build:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3



      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.PAT_GHCR }}



      - name: Build and push backend

        uses: docker/build-push-action@v6

        with:

          context: ./backend

          push: true

          tags: |

            ghcr.io/${{ github.repository }}/backend:latest

            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}



      - name: Build and push frontend

        uses: docker/build-push-action@v6

        with:

          context: ./frontend

          push: true

          tags: |

            ghcr.io/${{ github.repository }}/frontend:latest

            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}




# ==================================================
# DEV DEPLOYMENT
# Runs automatically on develop branch
# ==================================================

  deploy-dev:


    needs: build


    if: github.ref == 'refs/heads/develop'


    runs-on: ubuntu-latest



    environment:

      name: dev



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Login GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.PAT_GHCR }}



      - name: Pull images

        run: |

          docker compose pull



      - name: Start DEV environment

        run: |

          docker compose up -d



      - name: Check containers

        run: |

          docker ps




# ==================================================
# PROD DEPLOYMENT
# Requires manual approval
# ==================================================

  deploy-prod:


    needs: build


    if: github.ref == 'refs/heads/main'


    runs-on: ubuntu-latest



    environment:

      name: prod



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Login GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.PAT_GHCR }}



      - name: Pull images

        run: |

          docker compose pull



      - name: Start PROD environment

        run: |

          docker compose up -d



      - name: Check containers

        run: |

          docker ps

name: Fullstack CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ====================
  # 1. Build & Push Docker Images
  # ====================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GHCR }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # ====================
  # 2. Deploy to Dev (inside Actions runner)
  # ====================
  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GHCR }}

      - name: Start MongoDB
        run: |
          docker run -d --name mongo -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=example -p 27017:27017 mongo:6

      - name: Run Backend
        run: |
          docker run -d --name backend -p 3002:3000 \
            -e MONGO_URI=mongodb://root:example@localhost:27017/testdb \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Run Frontend
        run: |
          docker run -d --name frontend -p 3000:80 \
            -e REACT_APP_API_URL=http://localhost:3002 \
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Test Backend
        run: |
          echo "Testing backend..."
          curl -f http://localhost:3002/api/users || echo "Backend not ready"

  # ====================
  # 3. Deploy to Prod (inside Actions runner)
  # ====================
  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GHCR }}

      - name: Start MongoDB
        run: |
          docker run -d --name mongo -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=example -p 27017:27017 mongo:6

      - name: Run Backend
        run: |
          docker run -d --name backend -p 3002:3000 \
            -e MONGO_URI=mongodb://root:example@localhost:27017/proddb \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Run Frontend
        run: |
          docker run -d --name frontend -p 3000:80 \
            -e REACT_APP_API_URL=http://localhost:3002 \
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Test Backend
        run: |
          echo "Testing backend..."
          curl -f http://localhost:3002/api/users || echo "Backend not ready"
